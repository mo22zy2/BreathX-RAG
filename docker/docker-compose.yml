services:

  # =========================
  # FastAPI
  # =========================
  fastapi:
    build:
      context: ..
      dockerfile: docker/breathX/Dockerfile

    container_name: fastapi

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - fastapi_data:/app/assets

    networks:
      - backend

    restart: always

    depends_on:
      pgvector:
        condition: service_healthy

    env_file:
      - ./env/.env.app

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s


  # =========================
  # Nginx
  # =========================


  nginx:
    image: nginx:stable-alpine3.20-perl
    container_name: nginx
    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - fastapi
    networks:
      - backend
    restart: always



  # =========================
  # PostgreSQL + pgvector
  # =========================
  pgvector:
    image: pgvector/pgvector:0.8.0-pg17

    container_name: pgvector

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - pgvector:/var/lib/postgresql/data

    env_file:
      - ./env/.env.postgres

    networks:
      - backend

    restart: always

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s


  # =========================
  # Qdrant
  # =========================
  qdrant:
    image: qdrant/qdrant:v1.13.6

    container_name: qdrant

    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

    networks:
      - backend

    restart: always


  # =========================
  # Prometheus
  # =========================
  prometheus:
    image: prom/prometheus:v3.3.0

    container_name: prometheus

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - prometheus_data:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    networks:
      - backend

    restart: always

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"


  # =========================
  # Grafana
  # =========================
  grafana:
    image: grafana/grafana:11.6.16

    container_name: grafana

    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    env_file:
      - ./env/.env.grafana

    networks:
      - backend

    restart: always


  # =========================
  # Node Exporter
  # =========================
  node_exporter:
    image: prom/node-exporter:v1.12.1

    container_name: node-exporter

    ports:
      - "127.0.0.1:9100:9100"
  

    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

  

    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)"

    networks:
      - backend

    restart: always


  # =========================
  # PostgreSQL Exporter
  # =========================
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest

    container_name: postgres_exporter

    ports:
      - "127.0.0.1:9187:9187"

    env_file:
      - ./env/.env.postgres.exporter

    networks:
      - backend

    restart: always

  # =========================
  # RabbitMQ
  # =========================

  rabbitmq:
    image: rabbitmq:4.1.2-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"       # AMQP
      - "15672:15672"     # Management UI

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro

    env_file:
      - ./env/.env.rabbitmq

    networks:
      - backend

    restart: always

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  # =========================
  # Redis
  # =========================

  redis:
    image: redis:8.0.3-alpine
    container_name: redis
    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    env_file:
      - ./env/.env.redis

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
      - --protected-mode
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}

    networks:
      - backend

    restart: always

    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

# =========================
# Network
# =========================
networks:
  backend:
    driver: bridge

# =========================
# Volumes
# =========================
volumes:
  fastapi_data:
  pgvector:
  qdrant_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data:
  redis_data: