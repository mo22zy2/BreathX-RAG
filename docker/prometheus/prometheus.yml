global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  # =========================
  # FastAPI
  # =========================
  - job_name: "fastapi"
    metrics_path: "/a8K3mP9x_metrics"
    static_configs:
      - targets: ["fastapi:8000"]

  # =========================
  # Node Exporter
  # =========================
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node_exporter:9100"]

  # =========================
  # Prometheus
  # =========================
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # =========================
  # Qdrant
  # =========================
  - job_name: "qdrant"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["qdrant:6333"]

  # =========================
  # PostgreSQL
  # =========================
  - job_name: "postgres"
    static_configs:
      - targets: ["postgres_exporter:9187"]