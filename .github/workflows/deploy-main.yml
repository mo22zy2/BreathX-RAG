name: Deploy Main Branch to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_MAIN_HOST_IP }}
          username: github_user
          key: ${{ secrets.SSH_MAIN_PRIVATE_KEY }}
          script: |
            set -e

            cd /home/github_user/workspace/BreathX-RAG

            echo "📥 Fetching latest main branch..."
            git fetch origin main

            echo "🔄 Updating server..."
            git checkout main
            git reset --hard origin/main

            echo "🚀 Restarting BreathX service..."
            sudo systemctl restart breathx.service

            echo "⏳ Waiting for service to start..."
            sleep 5

            echo "🔍 Checking port 80..."

            for i in {1..6}; do
              if ss -tuln | grep -q ':80 '; then
                echo "✅ Port 80 is now active."
                break
              else
                echo "⏳ Port 80 not ready yet. Retrying in 5 seconds..."
                sleep 5
              fi
            done

            if ! ss -tuln | grep -q ':80 '; then
              echo "❌ Service failed to start on port 80"

              echo "📋 Service status:"
              sudo systemctl status breathx.service --no-pager || true

              echo "📋 Recent service logs:"
              sudo journalctl -u breathx.service -n 50 --no-pager || true

              exit 1
            fi

            echo "🔍 Checking systemd service..."

            if sudo systemctl is-active --quiet breathx.service; then
              echo "✅ breathx.service is active."
            else
              echo "❌ breathx.service is not active."

              sudo systemctl status breathx.service --no-pager || true
              sudo journalctl -u breathx.service -n 50 --no-pager || true

              exit 1
            fi

            echo "======================================"
            echo "✅ Deployment completed successfully!"
            echo "======================================"