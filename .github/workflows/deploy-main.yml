name: Deploy Main Branch to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_MAIN_HOST_IP }}
          username: github_user
          key: ${{ secrets.SSH_MAIN_PRIVATE_KEY }}
          script: |
            set -Eeuo pipefail

            cd /home/github_user/workspace/BreathX-RAG

            echo "📥 Updating repository..."
            git fetch origin main
            git checkout main
            git reset --hard origin/main

            echo "🔄 Reloading systemd..."
            sudo systemctl daemon-reload

            echo "🚀 Restarting BreathX service..."
            sudo systemctl restart breathx.service

            echo "⏳ Waiting for service..."

            for i in {1..12}; do
              if sudo systemctl is-active --quiet breathx.service; then
                echo "✅ breathx.service is active."
                break
              fi

              echo "⏳ Service not active yet. Attempt $i/12..."

              if [ "$i" -eq 12 ]; then
                echo "❌ Service failed to become active."

                echo "===== SYSTEMD STATUS ====="
                sudo systemctl status breathx.service --no-pager || true

                echo "===== SERVICE LOGS ====="
                sudo journalctl -u breathx.service -n 100 --no-pager || true

                echo "===== LISTENING PORTS ====="
                sudo ss -ltnp || true

                exit 1
              fi

              sleep 5
            done

            echo "🌐 Checking HTTP connection..."

            for i in {1..12}; do
              if curl \
                --fail \
                --silent \
                --show-error \
                --connect-timeout 2 \
                http://127.0.0.1/; then

                echo ""
                echo "✅ HTTP check passed."
                break
              fi

              echo "⏳ HTTP endpoint not ready. Attempt $i/12..."

              if [ "$i" -eq 12 ]; then
                echo "❌ HTTP check failed."

                echo "===== LISTENING PORTS ====="
                sudo ss -ltnp || true

                echo "===== SYSTEMD STATUS ====="
                sudo systemctl status breathx.service --no-pager || true

                echo "===== SERVICE LOGS ====="
                sudo journalctl -u breathx.service -n 100 --no-pager || true

                exit 1
              fi

              sleep 5
            done

            echo "======================================"
            echo "✅ DEPLOYMENT COMPLETED SUCCESSFULLY"
            echo "======================================"